<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>تحفيظ القرآن</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fbf8f1);
    --text: var(--tg-theme-text-color, #1f2a24);
    --hint: var(--tg-theme-hint-color, #8a8f88);
    --accent: var(--tg-theme-button-color, #1f7a4d);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --panel: var(--tg-theme-secondary-bg-color, #f0ebde);
    --font-size: 30px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: "Cairo", sans-serif; padding-bottom: 170px; }

  header { padding: 14px 16px 6px; text-align: center; }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; }
  header p { margin: 2px 0 0; color: var(--hint); font-size: 13px; }

  #text {
    padding: 8px 16px 24px;
    font-family: "Amiri Quran", "Amiri", serif;
    font-size: var(--font-size);
    line-height: 2.25;
    text-align: justify;
    text-align-last: center;
  }
  .w { border-radius: 8px; padding: 0 2px; cursor: pointer; transition: background .15s, color .15s; }
  .w.active { background: var(--accent); color: var(--accent-text); }
  .w.hid { color: transparent; background: color-mix(in srgb, var(--hint) 18%, transparent); }
  .w.hid.active { color: var(--accent-text); background: var(--accent); }
  .end { color: var(--accent); white-space: nowrap; margin: 0 2px; }

  #status { text-align: center; color: var(--hint); padding: 40px 16px; font-size: 15px; }

  nav {
    position: fixed; inset: auto 0 0 0;
    padding: 8px 16px calc(10px + env(safe-area-inset-bottom));
    background: var(--panel);
    border-top: 1px solid color-mix(in srgb, var(--hint) 25%, transparent);
  }
  #step { text-align: center; font-size: 13px; color: var(--hint); min-height: 20px; margin-bottom: 6px; }
  .row { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .row + .row { margin-top: 8px; }
  nav button {
    font-family: inherit; font-size: 15px; font-weight: 700;
    border: 0; border-radius: 12px; height: 44px; padding: 0 10px; flex: 1; max-width: 120px;
    background: var(--bg); color: var(--text);
  }
  nav button.on { background: color-mix(in srgb, var(--accent) 20%, var(--bg)); color: var(--accent); }
  nav button:disabled { opacity: .4; }
  #play { background: var(--accent); color: var(--accent-text); font-size: 22px; max-width: 90px; }
</style>
</head>
<body>
<header>
  <h1 id="title">…</h1>
  <p id="sub"></p>
</header>
<div id="status">جاري التحميل…</div>
<div id="text" hidden></div>

<nav>
  <div id="step"></div>
  <div class="row">
    <button id="smaller" aria-label="تصغير الخط">ا−</button>
    <button id="bigger" aria-label="تكبير الخط">ا+</button>
    <button id="hide" aria-label="إخفاء الكلمات">🙈 إخفاء</button>
    <button id="speed" aria-label="سرعة التلاوة">⏱ 1×</button>
  </div>
  <div class="row">
    <button id="mode" aria-label="طريقة التكرار">المقطع كله</button>
    <button id="play" disabled aria-label="تشغيل">▶</button>
    <button id="rep" aria-label="عدد مرات التكرار">🔁 ×3</button>
  </div>
</nav>

<audio id="audio" preload="auto"></audio>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const params = new URLSearchParams(location.search);
const S = +params.get("s") || 1;
const A = +params.get("a") || 1;
const B = Math.max(+params.get("b") || A, A);
const RECITER = +params.get("r") || 12;

const $ = (id) => document.getElementById(id);
const audio = $("audio");
const textEl = $("text");
const toArabic = (n) => String(n).replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[d]);

// إعدادات المستخدم تُحفظ على جهازه
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// ── حجم الخط ──
let fontSize = +store.get("fontSize") || 30;
function applyFont() {
  document.documentElement.style.setProperty("--font-size", fontSize + "px");
  store.set("fontSize", fontSize);
}
applyFont();
$("bigger").onclick = () => { fontSize = Math.min(fontSize + 4, 64); applyFont(); };
$("smaller").onclick = () => { fontSize = Math.max(fontSize - 4, 18); applyFont(); };

// ── السرعة ──
const SPEEDS = [0.75, 1, 1.25];
let speed = +store.get("speed") || 1;
function applySpeed() {
  audio.playbackRate = speed;
  $("speed").textContent = `⏱ ${speed}×`;
  store.set("speed", speed);
}
$("speed").onclick = () => { speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]; applySpeed(); };
applySpeed();

// ── الإخفاء: الكلمات مخفية وتظهر وقت ما الشيخ يقولها ──
let hideOn = store.get("hide") === "1";
function applyHide() {
  $("hide").classList.toggle("on", hideOn);
  document.querySelectorAll(".w").forEach((el) => el.classList.toggle("hid", hideOn));
  store.set("hide", hideOn ? "1" : "0");
}
$("hide").onclick = () => { hideOn = !hideOn; applyHide(); };

// ── خطة التكرار ──
// "block": المقطع كله يتكرر. "chain": كل آية تتكرر لوحدها ثم تُربط بما قبلها.
const REPEAT_OPTIONS = [1, 3, 5, 7, 10];
let repeatTotal = +params.get("rep") || 3;
let mode = store.get("mode") === "chain" ? "chain" : "block";
let plan = [], stepIdx = 0, repDone = 0;

function buildPlan() {
  if (mode === "block" || A === B) {
    return [{ from: A, to: B, times: repeatTotal, label: B > A ? "المقطع كله" : `الآية ${toArabic(A)}` }];
  }
  const steps = [];
  for (let v = A; v <= B; v++) {
    steps.push({ from: v, to: v, times: repeatTotal, label: `الآية ${toArabic(v)}` });
    if (v > A) {
      steps.push({ from: A, to: v, times: Math.min(2, repeatTotal),
                   label: `ربط ${toArabic(A)} – ${toArabic(v)}` });
    }
  }
  return steps;
}

function showStep() {
  const st = plan[stepIdx];
  $("step").textContent = st
    ? `${st.label} · التكرار ${toArabic(Math.min(repDone + 1, st.times))}/${toArabic(st.times)}` +
      (plan.length > 1 ? ` · الخطوة ${toArabic(stepIdx + 1)}/${toArabic(plan.length)}` : "")
    : "";
  $("mode").textContent = mode === "chain" ? "آية آية + ربط" : "المقطع كله";
  $("mode").classList.toggle("on", mode === "chain");
  $("rep").textContent = `🔁 ×${repeatTotal}`;
}

function resetPlan(keepStep = false) {
  plan = buildPlan();
  if (!keepStep) stepIdx = 0;
  stepIdx = Math.min(stepIdx, plan.length - 1);
  repDone = 0;
  showStep();
}

$("rep").onclick = () => {
  repeatTotal = REPEAT_OPTIONS[(REPEAT_OPTIONS.indexOf(repeatTotal) + 1) % REPEAT_OPTIONS.length];
  resetPlan(true);
};
$("mode").onclick = () => {
  mode = mode === "chain" ? "block" : "chain";
  store.set("mode", mode);
  resetPlan();
  if (timings) startStep();
};

// ── تحميل الآيات والتوقيتات ──
let segments = [];      // [{start, end, el, verse}] لكل كلمة بالترتيب
let timings = null;     // رقم الآية -> {from, to} بالثواني
const verseWords = {};  // رقم الآية -> عناصر كلماتها

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function load() {
  const pages = [];
  for (let p = Math.ceil(A / 50); p <= Math.ceil(B / 50); p++) pages.push(p);
  const [chapter, audioData, ...versePages] = await Promise.all([
    getJSON(`https://api.quran.com/api/v4/chapters/${S}?language=ar`),
    getJSON(`https://api.qurancdn.com/api/qdc/audio/reciters/${RECITER}/audio_files?chapter=${S}&segments=true`),
    ...pages.map((p) => getJSON(
      `https://api.quran.com/api/v4/verses/by_chapter/${S}?words=true&word_fields=text_uthmani&per_page=50&page=${p}`)),
  ]);

  $("title").textContent = `سورة ${chapter.chapter.name_arabic}`;
  $("sub").textContent = B > A ? `الآيات ${A} – ${B}` : `الآية ${A}`;

  const verses = versePages.flatMap((p) => p.verses)
    .filter((v) => v.verse_number >= A && v.verse_number <= B);
  const file = audioData.audio_files[0];
  const raw = Object.fromEntries(file.verse_timings.map((t) => [+t.verse_key.split(":")[1], t]));
  timings = {};

  const frag = document.createDocumentFragment();
  for (const v of verses) {
    const n = v.verse_number;
    const wordEls = {};
    verseWords[n] = [];
    for (const w of v.words) {
      const span = document.createElement("span");
      if (w.char_type_name === "end") {
        span.className = "end";
        span.textContent = `﴿${toArabic(n)}﴾`;
      } else {
        span.className = "w";
        span.textContent = w.text_uthmani;
        wordEls[w.position] = span;
        verseWords[n].push(span);
      }
      frag.append(span, " ");
    }
    const t = raw[n];
    timings[n] = { from: t.timestamp_from / 1000, to: t.timestamp_to / 1000 };
    for (const seg of t.segments || []) {
      if (seg.length < 3) continue;
      const [pos, start, end] = [seg[0], seg[seg.length - 2], seg[seg.length - 1]];
      const el = wordEls[pos];
      if (!el) continue;
      segments.push({ start: start / 1000, end: end / 1000, el, verse: n });
      el.onclick = () => jumpToWord(n, start / 1000);
    }
  }
  textEl.append(frag);
  segments.sort((x, y) => x.start - y.start);

  audio.src = file.audio_url;
  applySpeed();
  applyHide();
  resetPlan();
  audio.currentTime = timings[A].from;

  $("status").hidden = true;
  textEl.hidden = false;
  $("play").disabled = false;
}

// ── التشغيل ──
const stepStart = () => timings[plan[stepIdx].from].from;
const stepEnd = () => timings[plan[stepIdx].to].to;

function rehideStep() {
  if (!hideOn) return;
  const st = plan[stepIdx];
  for (let v = st.from; v <= st.to; v++) verseWords[v]?.forEach((el) => el.classList.add("hid"));
}

function startStep() {
  audio.currentTime = stepStart();
  rehideStep();
  showStep();
}

function jumpToWord(verse, time) {
  if (mode === "chain") {
    const i = plan.findIndex((s) => s.from === verse && s.to === verse);
    if (i >= 0) { stepIdx = i; repDone = 0; showStep(); }
  }
  audio.currentTime = time;
  play();
}

let active = null, raf = 0;

function highlight() {
  const t = audio.currentTime;
  const seg = segments.find((s) => t >= s.start && t < s.end);
  const el = seg ? seg.el : null;
  if (el !== active) {
    active?.classList.remove("active");
    if (el) {
      el.classList.add("active");
      el.classList.remove("hid");
      el.scrollIntoView({ block: "center", behavior: "smooth" });
    }
    active = el;
  }
}

function tick() {
  if (audio.currentTime >= stepEnd()) {
    repDone++;
    if (repDone >= plan[stepIdx].times) {
      repDone = 0;
      stepIdx++;
      if (stepIdx >= plan.length) {           // خلصت الخطة كلها
        stepIdx = 0;
        audio.pause();
        applyHide();
        startStep();
        tg?.HapticFeedback?.notificationOccurred("success");
        return;
      }
    }
    startStep();
  }
  highlight();
  if (!audio.paused) raf = requestAnimationFrame(tick);
}

function play() {
  const t = audio.currentTime;
  if (t < stepStart() - 0.05 || t >= stepEnd()) startStep();
  audio.playbackRate = speed;
  audio.play();
}

audio.onplay = () => { $("play").textContent = "⏸"; cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); };
audio.onpause = () => { $("play").textContent = "▶"; highlight(); };
$("play").onclick = () => (audio.paused ? play() : audio.pause());

showStep();
load().catch((e) => {
  console.error(e);
  $("status").textContent = "⚠️ تعذّر التحميل، تأكد من الإنترنت وحاول مرة أخرى.";
});
</script>
</body>
</html>
